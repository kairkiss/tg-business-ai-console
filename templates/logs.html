{% extends "base.html" %}{% block content %}<h1>运行日志</h1><form class="toolbar" method="get"><select name="level"><option value="all" {% if level=='all' %}selected{% endif %}>全部级别</option><option value="INFO" {% if level=='INFO' %}selected{% endif %}>INFO</option><option value="WARNING" {% if level=='WARNING' %}selected{% endif %}>WARNING</option><option value="ERROR" {% if level=='ERROR' %}selected{% endif %}>ERROR</option></select><select name="category"><option value="all" {% if category=='all' %}selected{% endif %}>全部分类</option><option value="merge" {% if category=='merge' %}selected{% endif %}>消息合并</option><option value="media" {% if category=='media' %}selected{% endif %}>非文本</option><option value="filter" {% if category=='filter' %}selected{% endif %}>安全过滤</option><option value="prompt" {% if category=='prompt' %}selected{% endif %}>Prompt</option><option value="telegram" {% if category=='telegram' %}selected{% endif %}>Telegram</option><option value="deepseek" {% if category=='deepseek' %}selected{% endif %}>DeepSeek</option></select><button>筛选</button></form><form class="form compact" method="post" action="/logs/clear" onsubmit="return confirm('确认清空日志？')"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>输入 CLEAR 确认清空<input name="confirm" placeholder="CLEAR"></label><button class="danger">清空日志</button></form><section class="panel">{% for l in logs %}<div class="log {{ l.level|lower }}"><span>{{ l.level }}</span><p>{{ l.message }}</p><time>{{ l.created_at }} · {{ l.source }}</time></div>{% endfor %}</section>{% endblock %}
