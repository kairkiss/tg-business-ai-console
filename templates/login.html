<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>登录</title></head><body class="login-page"><form class="login-card" method="post" action="/login"><h1>登录控制台</h1><p>Telegram Business AI 自动回复后台</p>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}<label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form></body></html>
