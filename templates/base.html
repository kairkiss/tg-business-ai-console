<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="csrf-token" content="{{ csrf_token }}"><title>{{ title or "Kai AI 控制台" }}</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><div><div class="brand">Kai AI 控制台</div><div class="sub">Telegram Business 自动回复</div></div><form method="post" action="/logout"><button class="ghost">退出</button></form></header><nav class="tabs"><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">总览</a><a href="/accounts" class="{% if request.url.path.startswith('/accounts') %}active{% endif %}">Business 账号</a><a href="/chats" class="{% if request.url.path.startswith('/chats') %}active{% endif %}">聊天管理 (Legacy)</a><a href="/personas" class="{% if request.url.path.startswith('/personas') %}active{% endif %}">提示词人格</a><a href="/ai" class="{% if request.url.path == '/ai' %}active{% endif %}">AI 设置</a><a href="/connections" class="{% if request.url.path == '/connections' %}active{% endif %}">Telegram 连接</a><a href="/logs" class="{% if request.url.path == '/logs' %}active{% endif %}">运行日志</a><a href="/system" class="{% if request.url.path == '/system' %}active{% endif %}">系统设置</a></nav><main>{% if flash %}<div class="toast">{{ flash }}</div>{% endif %}{% block content %}{% endblock %}</main><script>async function postApi(path){const token=document.querySelector('meta[name="csrf-token"]').content;const r=await fetch(path,{method:'POST',headers:{'x-csrf-token':token}});const d=await r.json().catch(()=>({}));showToast(d.ok?'操作成功':JSON.stringify(d));setTimeout(()=>location.reload(),700)}function showToast(t){const e=document.createElement('div');e.className='toast floating';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}function filterCards(){const q=(document.getElementById('chatSearch')?.value||'').toLowerCase();document.querySelectorAll('[data-chat-card]').forEach(c=>{c.style.display=c.dataset.search.includes(q)?'':'none'})}async function testPersona(){const f=document.getElementById('personaForm');const token=document.querySelector('meta[name="csrf-token"]').content;const data=new FormData(f);data.set('csrf',token);data.set('test_message',document.getElementById('personaTestMessage').value||'你好');const r=await fetch('/personas/test',{method:'POST',body:data});const j=await r.json();document.getElementById('personaTestResult').textContent=j.ok?j.reply:j.error}</script></body></html>
